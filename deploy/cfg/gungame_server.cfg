// Server identity
hostname "★ GunGame [Custom] ★ Mario + Quake Sounds | Map Voting | Insta-Respawn"

// GunGame CS2 - recommended server settings
// Put this file in csgo/cfg/ and add "exec gungame_server.cfg" to your server.cfg

// No buying - the plugin hands out weapons
mp_buytime 0
mp_buy_anywhere 0
mp_startmoney 0
mp_maxmoney 0

// No cash award chat spam ("+$150 for neutralizing...")
mp_playercashawards 0
mp_teamcashawards 0

// Don't drop guns on death (keeps the map clean, prevents weapon swapping)
mp_death_drop_gun 0
mp_death_drop_grenade 0
mp_death_drop_defuser 0

// Long rounds, win by levels rather than round score
mp_roundtime 60
mp_roundtime_defuse 60
mp_roundtime_hostage 60
mp_maxrounds 0
mp_timelimit 60
mp_freezetime 1
mp_warmuptime 15

// Free-for-all style friendly fire is optional:
// mp_teammates_are_enemies 1

// Arms Race style respawning (optional - comment out for round-based GunGame)
mp_respawn_on_death_ct 1
mp_respawn_on_death_t 1
mp_respawn_immunitytime 2

// Instant respawn - no death freeze cam
spec_freeze_time 0
spec_freeze_time_lock 0
spec_freeze_deathanim_time 0

// Don't auto-balance mid-streak
mp_autoteambalance 0
mp_limitteams 0

